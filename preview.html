<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رتّل | المحرر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Naskh+Arabic:wght@400;600&family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Reem+Kufi:wght@400;600&family=Tajawal:wght@400;700&family=Lateef&family=Cinzel:wght@400;600&family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0e11;--p1:#16161b;--p2:#1d1d24;--p3:#26262f;--line:#2c2c36;--tx:#efece6;--mu:#9a98a3;--ac:#e8b45a;--ac2:#f6d28f;--ink:#1a1206;--bad:#ff6b5b;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:400 14px/1.5 "IBM Plex Sans Arabic",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;direction:ltr}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button{font:inherit;color:inherit;background:var(--p2);border:1px solid var(--line);border-radius:10px;cursor:pointer;min-height:36px;padding:0 12px;transition:background .12s,border-color .12s,color .12s}
button:hover{background:var(--p3)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:not-allowed}
button.on,button[aria-pressed="true"]{background:var(--ac);color:var(--ink);border-color:var(--ac);font-weight:600}
button.pri{background:var(--ac);color:var(--ink);border-color:var(--ac);font-weight:600;min-height:40px;padding:0 18px}
button.pri:hover{background:var(--ac2)}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover{background:var(--p2)}
.ic{width:40px;padding:0;display:inline-grid;place-items:center}
.ic svg{width:19px;height:19px}
input[type=range]{width:100%;accent-color:var(--ac);height:24px}
input[type=text],input[type=number],select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 10px;min-height:36px;width:100%}
input[type=color]{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:none;padding:2px;cursor:pointer}
input[type=file]{font-size:12px;color:var(--mu);width:100%}
.app{display:grid;grid-template-rows:56px 1fr auto;height:100vh}
header{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--p1)}
header .brand{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
header .brand i{width:10px;height:10px;border-radius:50%;background:var(--ac);box-shadow:0 0 12px var(--ac)}
header .meta{color:var(--mu);font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid{display:grid;grid-template-columns:72px 340px 1fr;min-height:0}
.rail{background:var(--p1);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:8px 6px;overflow-y:auto}
.rail button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px;padding:6px 2px;font-size:11px;background:transparent;border-color:transparent;color:var(--mu)}
.rail button svg{width:20px;height:20px}
.rail button:hover{color:var(--tx);background:var(--p2)}
.rail button.on{background:var(--p2);color:var(--ac);border-color:var(--line);font-weight:500}
.panel{background:var(--p1);border-left:1px solid var(--line);overflow-y:auto;padding:14px 14px 30px}
.panel h3{font-size:12px;font-weight:600;color:var(--mu);margin:18px 0 8px;letter-spacing:.2px}
.panel h3:first-child{margin-top:2px}
.field{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:8px;margin:7px 0}
.field>label{color:var(--mu);font-size:12.5px}
.field .val{font-size:11px;color:var(--mu);min-width:34px;text-align:left}
.rng{display:flex;align-items:center;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{min-height:32px;padding:0 10px;font-size:12.5px;border-radius:8px}
.cols{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.cols .sw{width:26px;height:26px;min-height:0;border-radius:50%;padding:0;border:2px solid var(--line)}
.cols .sw.on{border-color:var(--ac)}
.tpl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpl button{padding:0;border-radius:12px;overflow:hidden;min-height:0;display:flex;flex-direction:column;background:var(--p2);text-align:right}
.tpl canvas{width:100%;aspect-ratio:9/13;display:block;background:#000}
.tpl span{padding:7px 10px;font-size:12.5px}
.tpl button.on{outline:2px solid var(--ac);background:var(--p2);color:var(--tx)}
.hint{color:var(--mu);font-size:12px;line-height:1.75;margin-top:6px}
.card{background:var(--p2);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:8px 0}
.stage{position:relative;display:grid;place-items:center;min-width:0;min-height:0;background:radial-gradient(ellipse at center,#18181e 0%,#0b0b0d 70%);overflow:hidden}
#cv{display:block;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.55);touch-action:none;cursor:default}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--mu);background:var(--bg);z-index:5;text-align:center;padding:30px}
.bottom{background:var(--p1);border-top:1px solid var(--line)}
.trans{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.trans .sp{flex:1}
.trans .tc{font-size:13px;color:var(--mu);padding:0 6px}
.trans .tc b{color:var(--tx);font-weight:500}
.vol{display:flex;align-items:center;gap:6px;width:150px}
.segbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.segbar button{min-height:32px;font-size:12.5px;padding:0 10px}
.tlw{position:relative;height:150px;direction:ltr}
#tl{width:100%;height:100%;display:block;cursor:pointer}
.toast{position:fixed;bottom:200px;left:50%;transform:translateX(-50%);background:var(--p3);border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:40}
.modal.show{display:grid}
.modal .box{background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(440px,92vw)}
.modal video{width:100%;max-height:55vh;border-radius:10px;background:#000;margin-top:12px}
.bar{height:6px;background:var(--p3);border-radius:4px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
.dl{display:inline-flex;align-items:center;min-height:42px;padding:0 16px;background:var(--ac);color:var(--ink);font-weight:600;text-decoration:none;border-radius:10px;margin-top:12px}
body.big .mid{grid-template-columns:0 0 1fr}body.big .rail,body.big .panel{display:none}
.stage:fullscreen{background:#000}.stage:fullscreen #cv{border-radius:0;box-shadow:none}
body.demo #exportBtn,body.demo #undo,body.demo #redo,body.demo #segbar{display:none}
.demobar{background:var(--ac);color:var(--ink);font-size:13px;padding:6px 14px;text-align:center;font-weight:500}
@media (max-width:1000px){.app{grid-template-rows:56px auto auto;height:auto}body{overflow:auto}.mid{grid-template-columns:1fr;grid-template-rows:auto auto auto}.rail{flex-direction:row;border-left:0;border-bottom:1px solid var(--line);overflow-x:auto}.rail button{min-width:64px}.stage{height:62vh;order:-1}.panel{max-height:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><i></i>رتّل</div>
    <div class="meta" id="meta">يحمّل…</div>
    <button class="ghost ic" id="undo" title="تراجع (Ctrl+Z)" aria-label="تراجع"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <button class="ghost ic" id="redo" title="إعادة (Ctrl+Y)" aria-label="إعادة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="ghost ic" id="bigBtn" title="كبّر المعاينة" aria-label="كبّر المعاينة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="ghost ic" id="fsBtn" title="ملء الشاشة" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 12h8M12 8v8"/></svg></button>
    <button class="pri" id="exportBtn">صدّر الفيديو</button>
  </header>
  <div class="mid">
    <nav class="rail" id="rail" aria-label="الأقسام"></nav>
    <section class="panel" id="panel"></section>
    <main class="stage" id="stage"><canvas id="cv" aria-label="المعاينة. اسحب أي عنصر لتغيير مكانه"></canvas><div class="loading" id="loading">يحمّل التلاوة…</div></main>
  </div>
  <div class="bottom">
    <div class="trans">
      <button class="ghost ic" id="back5" title="رجوع ٥ ثواني" aria-label="رجوع ٥ ثواني"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 7v10l-7-5zM20 7v10l-7-5z"/></svg></button>
      <button class="ic" id="play" aria-label="تشغيل" title="تشغيل (مسافة)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg></button>
      <button class="ghost ic" id="fwd5" title="قدّام ٥ ثواني" aria-label="قدّام ٥ ثواني"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 7v10l7-5zM4 7v10l7-5z"/></svg></button>
      <span class="tc mono"><b id="tc">0:00.0</b> / <span id="dur">0:00</span></span>
      <div class="vol"><button class="ghost ic" id="mute" aria-label="كتم الصوت" title="الصوت"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path id="volwave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button><input type="range" id="vol" min="0" max="2" step="0.05" aria-label="مستوى الصوت"></div>
      <span class="sp"></span>
      <div class="segbar" id="segbar"></div>
      <span class="sp"></span>
      <label class="mono" style="color:var(--mu);font-size:12px;display:flex;align-items:center;gap:6px">تكبير<input type="range" id="zoom" min="20" max="400" value="80" style="width:110px" aria-label="تكبير الخط الزمني"></label>
    </div>
    <div class="tlw"><canvas id="tl" aria-label="الخط الزمني: اسحب أطراف الآيات لتغيير وقت ظهورها واختفائها"></canvas></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box"><b id="mTitle">يصدّر…</b><div class="hint" id="mText"></div><div class="bar"><i id="mBar"></i></div><div id="mOut"></div><div style="display:flex;justify-content:flex-start;margin-top:14px"><button id="mClose">سكّر</button></div></div></div>
<video id="vid" playsinline preload="auto" style="display:none"></video>

<script>
'use strict';
const WK=location.origin;
const QS=new URLSearchParams(location.search);const DEMO=QS.get('demo')==='1'; // customer preview on the website: no designer, text from a public Quran API
const job=DEMO?'demo':QS.get('job');
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),vid=$('vid'),tl=$('tl'),tctx=tl.getContext('2d');
let D=null,DUR=1,W=1080,H=1920,box=null,segs=[],SIDE={},PEAKS=null,ready=false;
let selSeg=-1,selEl=null,drag=null,tab='tpl';
const IMG={};

/* ================= data helpers ================= */
const EN=['Al-Fatihah','Al-Baqarah','Ali Imran','An-Nisa','Al-Maidah','Al-Anam','Al-Araf','Al-Anfal','At-Tawbah','Yunus','Hud','Yusuf','Ar-Rad','Ibrahim','Al-Hijr','An-Nahl','Al-Isra','Al-Kahf','Maryam','Taha','Al-Anbiya','Al-Hajj','Al-Muminun','An-Nur','Al-Furqan','Ash-Shuara','An-Naml','Al-Qasas','Al-Ankabut','Ar-Rum','Luqman','As-Sajdah','Al-Ahzab','Saba','Fatir','Ya-Sin','As-Saffat','Sad','Az-Zumar','Ghafir','Fussilat','Ash-Shura','Az-Zukhruf','Ad-Dukhan','Al-Jathiyah','Al-Ahqaf','Muhammad','Al-Fath','Al-Hujurat','Qaf','Adh-Dhariyat','At-Tur','An-Najm','Al-Qamar','Ar-Rahman','Al-Waqiah','Al-Hadid','Al-Mujadilah','Al-Hashr','Al-Mumtahanah','As-Saff','Al-Jumuah','Al-Munafiqun','At-Taghabun','At-Talaq','At-Tahrim','Al-Mulk','Al-Qalam','Al-Haqqah','Al-Maarij','Nuh','Al-Jinn','Al-Muzzammil','Al-Muddaththir','Al-Qiyamah','Al-Insan','Al-Mursalat','An-Naba','An-Naziat','Abasa','At-Takwir','Al-Infitar','Al-Mutaffifin','Al-Inshiqaq','Al-Buruj','At-Tariq','Al-Ala','Al-Ghashiyah','Al-Fajr','Al-Balad','Ash-Shams','Al-Layl','Ad-Duha','Ash-Sharh','At-Tin','Al-Alaq','Al-Qadr','Al-Bayyinah','Az-Zalzalah','Al-Adiyat','Al-Qariah','At-Takathur','Al-Asr','Al-Humazah','Al-Fil','Quraysh','Al-Maun','Al-Kawthar','Al-Kafirun','An-Nasr','Al-Masad','Al-Ikhlas','Al-Falaq','An-Nas'];

const SIDES=[['none','بدون'],['tr','ترجمة إنجليزية'],['muyassar','التفسير الميسر'],['mukhtasar','المختصر في التفسير'],['saadi','تفسير السعدي'],['en','تفسير إنجليزي']];
const ARF=[['Noto Naskh Arabic','نسخ'],['Amiri','أميري'],['Aref Ruqaa','رقعة'],['Reem Kufi','كوفي'],['Tajawal','تجوّل'],['Lateef','لطيف'],['IBM Plex Sans Arabic','حديث']];
const LATF=[['Cinzel','Cinzel'],['Cormorant Garamond','Cormorant'],['Inter','Inter']];
const HARAKAT=new RegExp('['+String.fromCharCode(0x64B)+'-'+String.fromCharCode(0x652)+String.fromCharCode(0x670)+']','g');
const STRIP=new RegExp('['+String.fromCharCode(0x64B)+'-'+String.fromCharCode(0x65F)+String.fromCharCode(0x670)+String.fromCharCode(0x6D6)+'-'+String.fromCharCode(0x6ED)+String.fromCharCode(0x640)+String.fromCharCode(0xA0)+' ]','g');
const arn=n=>Number(n).toLocaleString('ar-EG',{useGrouping:false});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=(t,dec=1)=>{t=Math.max(0,t);const m=Math.floor(t/60),s=t-m*60;return m+':'+(dec?s.toFixed(dec).padStart(dec+3,'0'):String(Math.floor(s)).padStart(2,'0'))};

function segWords(sg){return sg.text.split(' ').filter(Boolean)}
function segText(sg){return sg.text}
function segAyat(sg){return[sg.ayah]}
function wordPlan(sg){const ws=segWords(sg);const wt=ws.map(w=>Math.max(1,w.replace(STRIP,'').length));const tot=wt.reduce((a,b)=>a+b,0)||1;let cum=0;
  return ws.map((w,k)=>{const s=sg.start+(sg.end-sg.start)*cum/tot;cum+=wt[k];return{s,e:k===ws.length-1?sg.end:sg.start+(sg.end-sg.start)*cum/tot}})}
function subText(sg){const src=S.sub.src;if(src==='none')return'';if(src===D.tafsir_key&&D.groups&&D.groups[sg.g])return D.groups[sg.g];const m=SIDE[src];if(!m||m.error)return'';return segAyat(sg).map(a=>m[a]||'').filter(Boolean).join(' ')}
function subRuns(){const r=[];segs.forEach(sg=>{const t=subText(sg);if(!t)return;const l=r[r.length-1];if(l&&l.text===t&&sg.start-l.end<1.2)l.end=Math.max(l.end,sg.end);else r.push({text:t,start:sg.start,end:sg.end})});return r}
function ayahRange(){let a0=Infinity,a1=-Infinity;segs.forEach(s=>{a0=Math.min(a0,s.ayah);a1=Math.max(a1,s.ayah)});return a0===Infinity?[D.ayah_from,D.ayah_to]:[a0,a1]}
function labelText(){if(S.label.text.trim())return S.label.text;const[a0,a1]=ayahRange();const n=EN[D.surah_no-1]||'';return `SURAH ${n.toUpperCase()} (${a0===a1?a0:a0+'-'+a1})`}
const calText=()=>String.fromCharCode(0xE000+parseInt(String(D.surah_no).padStart(3,'0'),16),0xE000); // the font keys each surah as E + its 3-digit number

/* ================= style + templates ================= */
const DEF={mode:'reel',
 bg:{type:'video',fit:'cover',gray:false,c1:'#0d0a12',c2:'#2a1d36',dim:0,fstyle:'round'},
 shade:{on:true,str:.85,col:'#000000',h:.5},
 ayah:{size:52,w:.86,col:'#ffffff',glow:false,glowCol:'#ffd27a',glowStr:1,shadow:true,anim:'all',dimA:.3,x:.5,y:.72,lh:1.75,look:'plain',hiCol:'#ffe14d',stroke:'#000000',boxCol:'#000000',boxA:.72,lyrics:false,gold:false},
 player:{on:false,y:.8},wave:{on:false,y:.83,col:'#ffffff'},
 fx:{shamsa:false,dust:false,sweep:false,numeral:false,paper:false,glass:false,col:'#e8c36a',gy0:.5,gy1:.86},
 sub:{src:'none',font:'Noto Naskh Arabic',size:24,col:'#e9e6df',caps:false,track:0,gap:26,lines:6},
 cal:{on:true,x:.5,y:.86,size:110,col:'#ffffff',glow:false},
 label:{on:false,text:'',font:'Cinzel',size:24,col:'#ffffff',track:4,x:.5,y:.8},
 reciter:{on:false,mode:'text',text:'',font:'Aref Ruqaa',size:56,col:'#ffffff',glow:false,x:.5,y:.93,img:false},
 logo:{on:false,x:.17,y:.08,size:190,box:true},
 custom:{on:false,text:'',font:'IBM Plex Sans Arabic',size:30,col:'#ffffff',x:.5,y:.05},
 decor:{frame:'none',divider:'none',card:'none',pattern:'none',col:'#d9b46a',op:.8},
 intro:{on:false,dur:1.6},outro:{on:false,text:'',dur:2},
 audio:{vol:1,fi:0,fo:.6},filt:{name:'none',bright:0,contrast:1,sat:1,warm:0,vig:0},q:{crf:16,scale:1},tpl:'hadi'};
const clone=o=>JSON.parse(JSON.stringify(o));
function merge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object')merge(a[k],b[k]);else a[k]=b[k]}return a}
const TPL={
 hadi:{name:'هادي',o:{ayah:{size:50,y:.745},cal:{y:.865,size:118},shade:{str:.9,h:.5}}},
 mutarjam:{name:'مترجم',o:{ayah:{size:46,y:.625},sub:{src:'tr',font:'Cormorant Garamond',size:25,caps:true,track:1.5,col:'#d9d6cf',gap:30,lines:4},
   label:{on:true,y:.755,size:22,track:5},cal:{y:.81,size:100},reciter:{on:true,y:.885,size:66},shade:{str:.92,h:.55}}},
 tabeea:{name:'طبيعة',o:{bg:{gray:true},shade:{str:.55,h:.35},ayah:{size:40,y:.875},cal:{on:false}}},
 tawahhoj:{name:'توهج',o:{ayah:{size:60,y:.655,glow:true,anim:'karaoke',col:'#fff6e6'},sub:{src:'@tafsir',size:25,col:'#f1e9f7'},
   decor:{divider:'diamond',col:'#ffd27a'},cal:{y:.86,col:'#fff6e6',glow:true,size:105},reciter:{on:true,y:.93,col:'#ffd27a',size:46},shade:{col:'#140a18',str:.88,h:.55}}},
 wasat:{name:'وسط',o:{bg:{dim:.5},shade:{on:false},ayah:{size:64,y:.5,anim:'karaoke',dimA:.35},sub:{src:'@tafsir',size:25,gap:44},cal:{y:.13,size:120},
   decor:{frame:'corners',divider:'star',pattern:'stars',op:.7}}},

let S=null;

/* ================= history ================= */
let hist=[],hi=-1,saveT=null;
const snap=()=>JSON.stringify({S,segs});
function commit(){const s=snap();if(hist[hi]===s)return;hist=hist.slice(0,hi+1);hist.push(s);if(hist.length>150)hist.shift();hi=hist.length-1;updUR();persist()}
let cT=null;function commitSoon(){clearTimeout(cT);cT=setTimeout(commit,350)}
function restore(s){const o=JSON.parse(s);S=o.S;segs=o.segs;selSeg=Math.min(selSeg,segs.length-1);onStyle();renderPanel();renderSegbar();persist()}
function undo(){if(hi>0){hi--;restore(hist[hi]);updUR();toast('تراجعت')}}
function redo(){if(hi<hist.length-1){hi++;restore(hist[hi]);updUR();toast('رجّعت')}}
function updUR(){$('undo').disabled=hi<=0;$('redo').disabled=hi>=hist.length-1}
function persist(){if(DEMO)return;try{localStorage.setItem('rattil-s2',JSON.stringify(S))}catch(e){}clearTimeout(saveT);saveT=setTimeout(()=>fetch(`${WK}/project/${job}`,{method:'POST',body:JSON.stringify({S,segs,v:3})}).catch(()=>{}),900)}
$('undo').onclick=undo;$('redo').onclick=redo;

/* ================= geometry ================= */
const CANVAS={square:[1080,1080],reel:[1080,1920],youtube:[1920,1080]};
const even=x=>Math.round(x/2)*2;
function vw(){return vid.videoWidth||D.w||1080}function vh(){return vid.videoHeight||D.h||1920}
function geometry(){
  if(S.mode==='original'&&D.has_video){const r=vw()/vh();if(r>=1){W=1920;H=even(1920/r)}else{W=1080;H=even(1080/r)}}else[W,H]=CANVAS[S.mode==='original'?'reel':S.mode];
  if(!D.has_video||S.bg.type!=='video'){box=null;return}
  const ar=vw()/vh();
  if(S.bg.fit==='frame'&&S.bg.fstyle==='polaroid'&&H>W){const m=Math.round(W*.13);box=[m,Math.round(H*.09),even(W-2*m),even(H*.43)];return}
  if(S.bg.fit==='frame'){if(W>H)box=[Math.round(W*.25),Math.round(H*.05),even(W*.5),even(H*.5)];else if(W===H)box=[Math.round(W*.14),Math.round(H*.05),even(W*.72),even(H*.48)];else{const m=Math.round(W*.06);box=[m,Math.round(H*.055),even(W-2*m),even(H*.5)]}return}
  if(S.bg.fit==='cover'){box=[0,0,W,H];return}
  if(W/H>ar){const fw=even(H*ar);box=[Math.round((W-fw)/2),0,fw,H]}else{const fh=even(W/ar);box=[0,Math.round((H-fh)/2),W,fh]}
}
let K=1;
function fitCanvas(){const st=$('stage');const pad=document.fullscreenElement?0:40;const bw=st.clientWidth-pad,bh=st.clientHeight-pad;if(bw<10||bh<10)return;const r=W/H;let cw=bw,ch=bw/r;if(ch>bh){ch=bh;cw=bh*r}
  cv.style.width=cw+'px';cv.style.height=ch+'px';const dpr=Math.min(1.6,window.devicePixelRatio||1);cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);K=cv.width/W}
window.addEventListener('resize',()=>{if(ready){fitCanvas();fitTL()}});

/* ================= drawing ================= */
const F=(px,fam,wt)=>`${wt||''} ${Math.round(px)}px "${fam}"`.trim();
function wrap(c,text,maxw){const ws=text.split(' ');const lines=[];let cur='';for(const w of ws){const t=cur?cur+' '+w:w;if(c.measureText(t).width>maxw&&cur){lines.push(cur);cur=w}else cur=t}if(cur)lines.push(cur);return lines}
function txt(c,lines,cx,y0,lh,col,o={}){
  if(o.glow>0){c.save();c.fillStyle=o.glowCol||col;for(const[b,a]of[[30,.4],[14,.55],[5,.8]]){c.shadowColor=o.glowCol||col;c.shadowBlur=b*Math.max(.5,o.glow);c.globalAlpha*=1;c.save();c.globalAlpha=c.globalAlpha*Math.min(1,a*o.glow);lines.forEach((l,i)=>c.fillText(l,cx,y0+i*lh));c.restore()}c.restore()}
  c.save();if(o.box){const fs=parseFloat(c.font.match(/(\d+(\.\d+)?)px/)[1]);c.fillStyle=rgba(o.box,o.boxA??.72);lines.forEach((l,i)=>{const w=c.measureText(l).width;c.beginPath();c.roundRect(cx-w/2-fs*.4,y0+i*lh-fs*1.02,w+fs*.8,fs*1.5,fs*.28);c.fill()})}
  if(o.stroke){const fs=parseFloat(c.font.match(/(\d+(\.\d+)?)px/)[1]);c.lineJoin='round';c.strokeStyle=o.stroke;c.lineWidth=fs*.14;lines.forEach((l,i)=>c.strokeText(l,cx,y0+i*lh))}
  if(o.shadow){c.shadowColor='rgba(0,0,0,.55)';c.shadowBlur=6;c.shadowOffsetY=2}
  if(o.gold){const fs=parseFloat(c.font.match(/(\d+(\.\d+)?)px/)[1]);const g=c.createLinearGradient(0,y0-fs,0,y0+(lines.length-1)*lh+fs*.4);g.addColorStop(0,'#fff3c4');g.addColorStop(.45,'#e8b84a');g.addColorStop(.7,'#a8741c');g.addColorStop(1,'#f6d27a');c.fillStyle=g}else c.fillStyle=col;
  lines.forEach((l,i)=>c.fillText(l,cx,y0+i*lh));c.restore()}
function hex(h){return[1,3,5].map(i=>parseInt(h.slice(i,i+2),16))}
const rgba=(h,a)=>{const[r,g,b]=hex(h);return`rgba(${r},${g},${b},${a})`};
function star8(c,x,y,r,fill){c.beginPath();for(let i=0;i<16;i++){const a=i*Math.PI/8-Math.PI/2,rr=i%2?r*.42:r;c.lineTo(x+rr*Math.cos(a),y+rr*Math.sin(a))}c.closePath();fill?c.fill():c.stroke()}
function diamond(c,x,y,r){c.beginPath();c.moveTo(x,y-r);c.lineTo(x+r*1.4,y);c.lineTo(x,y+r);c.lineTo(x-r*1.4,y);c.closePath();c.fill()}

const hit={};
function cssF(){const f=S.filt;return`${S.bg.gray?'grayscale(1) ':''}brightness(${(1+f.bright*.8).toFixed(3)}) contrast(${f.contrast}) saturate(${f.sat})`}
function warmOver(c,x,y,w,h){const v=S.filt.warm;if(Math.abs(v)<.01)return;c.save();c.globalCompositeOperation='soft-light';c.fillStyle=v>0?`rgba(255,150,40,${v*.55})`:`rgba(40,120,255,${-v*.55})`;c.fillRect(x,y,w,h);c.restore()}
// small offscreen for cheap blur in preview
const sm=document.createElement('canvas'),smc=sm.getContext('2d');
function drawBase(c,preview){
  if(D.has_video&&S.bg.type==='video'&&box){
    const[x,y,w,h]=box;
    if(S.bg.fit==='frame'){c.fillStyle=S.bg.c1;c.fillRect(0,0,W,H);c.save();c.filter=cssF();c.beginPath();c.rect(x,y,w,h);c.clip();const r=Math.max(w/vw(),h/vh());c.drawImage(vid,x+(w-vw()*r)/2,y+(h-vh()*r)/2,vw()*r,vh()*r);c.filter='none';warmOver(c,x,y,w,h);c.restore();return}
    c.save();c.filter=cssF();
    if(S.bg.fit==='blur'&&!(x===0&&y===0&&w===W&&h===H)){sm.width=Math.round(W/14);sm.height=Math.round(H/14);const r=Math.max(sm.width/vw(),sm.height/vh());smc.drawImage(vid,(sm.width-vw()*r)/2,(sm.height-vh()*r)/2,vw()*r,vh()*r);
      c.imageSmoothingQuality='high';c.drawImage(sm,0,0,W,H);c.fillStyle='rgba(0,0,0,.06)';c.fillRect(0,0,W,H)}
    else{c.fillStyle='#000';c.fillRect(0,0,W,H)}
    if(S.bg.fit==='cover'){const r=Math.max(W/vw(),H/vh()),ox=(W-vw()*r)/2,oy=(H-vh()*r)/2;c.drawImage(vid,ox,oy,vw()*r,vh()*r);
      if(S.fx.glass){const[gx,gy,gw,gh]=glassRect();sm.width=Math.round(gw/16);sm.height=Math.round(gh/16);smc.drawImage(vid,(gx-ox)/r,(gy-oy)/r,gw/r,gh/r,0,0,sm.width,sm.height);c.imageSmoothingQuality='high';c.drawImage(sm,gx,gy,gw,gh)}}
    else c.drawImage(vid,x,y,w,h);
    c.filter='none';warmOver(c,0,0,W,H);c.restore();return}
  if(S.bg.type==='image'&&IMG.bg){const im=IMG.bg,r=Math.max(W/im.width,H/im.height);c.save();c.filter=cssF();c.drawImage(im,(W-im.width*r)/2,(H-im.height*r)/2,im.width*r,im.height*r);c.filter='none';warmOver(c,0,0,W,H);c.restore();return}
  if(S.bg.type==='color'){c.fillStyle=S.bg.c1;c.fillRect(0,0,W,H);return}
  const g=c.createRadialGradient(W/2,H*.38,0,W/2,H*.38,Math.max(W,H)*.85);g.addColorStop(0,S.bg.c2);g.addColorStop(1,S.bg.c1);c.fillStyle=g;c.fillRect(0,0,W,H);
}
function drawPattern(c){const d=S.decor;if(d.pattern==='none')return;c.save();c.strokeStyle=d.col;c.globalAlpha=.09*d.op/.8;c.lineWidth=1.3;const s=W<1500?130:150;
  for(let y=-s;y<H+s;y+=s)for(let x=-s;x<W+s;x+=s){const cx=x+((Math.round(y/s)%2)?s/2:0);if(d.pattern==='stars')star8(c,cx,y,s*.3);else{c.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3;c.lineTo(cx+s*.34*Math.cos(a),y+s*.34*Math.sin(a))}c.closePath();c.stroke();c.beginPath();c.arc(cx,y,s*.14,0,7);c.stroke()}}c.restore()}
function drawFrame(c){const d=S.decor,f=d.frame;if(f==='none')return;const m=W<1500?40:34;c.save();c.strokeStyle=d.col;c.fillStyle=d.col;c.globalAlpha=d.op;c.lineWidth=2.2;
  if(f==='line'||f==='double'){c.beginPath();c.roundRect(m,m,W-2*m,H-2*m,18);c.stroke();if(f==='double'){c.globalAlpha=d.op*.55;c.lineWidth=1.2;c.beginPath();c.roundRect(m+12,m+12,W-2*m-24,H-2*m-24,12);c.stroke()}}
  else if(f==='corners'){const L=W*.13;for(const[x,y,sx,sy]of[[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]]){c.beginPath();c.moveTo(x,y+sy*L);c.lineTo(x,y);c.lineTo(x+sx*L,y);c.stroke();
    c.beginPath();c.moveTo(x+sx*14,y+sy*(L*.6));c.lineTo(x+sx*14,y+sy*14);c.lineTo(x+sx*(L*.6),y+sy*14);c.globalAlpha=d.op*.6;c.stroke();c.globalAlpha=d.op;star8(c,x+sx*30,y+sy*30,10,true)}}
  else if(f==='arch'){const top=H*.07,bot=H-m,l=m+10,r=W-m-10,mid=W/2;c.beginPath();c.moveTo(l,bot);c.lineTo(l,top+W*.32);c.quadraticCurveTo(l,top+W*.05,mid,top);c.quadraticCurveTo(r,top+W*.05,r,top+W*.32);c.lineTo(r,bot);c.stroke();
    c.globalAlpha=d.op*.5;c.lineWidth=1.2;c.beginPath();c.moveTo(l+14,bot-14);c.lineTo(l+14,top+W*.33);c.quadraticCurveTo(l+14,top+W*.07,mid,top+18);c.quadraticCurveTo(r-14,top+W*.07,r-14,top+W*.33);c.lineTo(r-14,bot-14);c.stroke();c.globalAlpha=d.op;star8(c,mid,top-2,12,true)}
  c.restore()}
function drawDivider(c,y,wid,a){const d=S.decor;if(d.divider==='none')return;c.save();c.globalAlpha*=d.op*a;c.strokeStyle=d.col;c.fillStyle=d.col;c.lineWidth=1.6;const cx=W/2,hw=wid/2;
  if(d.divider==='line'){c.beginPath();c.moveTo(cx-hw*.6,y);c.lineTo(cx+hw*.6,y);c.stroke()}
  else{const g=d.divider==='star'?26:20;c.beginPath();c.moveTo(cx-hw,y);c.lineTo(cx-g,y);c.moveTo(cx+g,y);c.lineTo(cx+hw,y);c.stroke();
    if(d.divider==='star')star8(c,cx,y,12,true);else{diamond(c,cx,y,7);diamond(c,cx-g-8,y,3);diamond(c,cx+g+8,y,3)}}c.restore()}
function drawStatic(c){ // dim, shade, pattern, frame, calligraphy, label, reciter, logo, custom

    const fi=prev&&s.start-prev.end<.05?.12:FI,fo=next&&next.start-s.end<.05?.12:FO;p.aA=clamp(Math.min((t-s.start)/fi,(s.end-t)/fo),0,1);
    if(S.ayah.anim!=='all'){const wp=wordPlan(s);p.lit=Math.max(1,wp.filter(w=>t>=w.s).length);if(S.ayah.anim==='rise')p.wp=q8(clamp((t-wp[p.lit-1].s)/.35,0,1))}
    if(S.fx.sweep){const k=(t-s.start)%4;p.wp+=k<1.3?100+Math.floor(k*10):0}break}}
  const R=RUNS;for(let i=0;i<R.length;i++){const r=R[i];if(t>=r.start&&t<r.end){p.run=i;p.sA=clamp(Math.min((t-r.start)/FI,(r.end-t)/FO),0,1);break}}
  if(S.intro.on)p.iA=t<S.intro.dur?clamp((S.intro.dur-t)/.5,0,1):0;
  if(S.outro.on&&S.outro.text.trim())p.oA=t>DUR-S.outro.dur?clamp((t-(DUR-S.outro.dur))/.5,0,1):0;

    if(nx&&nx.start-sg.end<8){const L=wrap(c,segText(nx),W*A.w);c.globalAlpha=.32*p.aA;txt(c,L.slice(0,2),W*A.x,AB.base+gap,AB.size*.62*1.6,A.col,{shadow:A.shadow})}c.restore()}

document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)&&document.activeElement.type!=='range')return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}
  else if(e.code==='Space'){e.preventDefault();togglePlay()}
  else if(e.key==='['||e.key===']'){const s=segs[selSeg];if(!s)return;const t=vid.currentTime;if(e.key==='['&&t<s.end-.15)s.start=+Math.max(t,(segs[selSeg-1]||{end:0}).end).toFixed(2);if(e.key===']'&&t>s.start+.15)s.end=+Math.min(t,(segs[selSeg+1]||{start:DUR}).start).toFixed(2);RUNS=subRuns();commit();renderSegbar()}
  else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){if(e.target===document.body||e.target===tl||e.target===cv){e.preventDefault();seek(vid.currentTime+(e.key==='ArrowRight'?1:-1)*(e.shiftKey?1:.1))}}
  else if((e.key==='Delete'||e.key==='Backspace')&&selSeg>=0&&e.target===document.body){segs.splice(selSeg,1);selSeg=-1;RUNS=subRuns();commit();renderSegbar()}});

let toT=null;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toT);toT=setTimeout(()=>t.classList.remove('show'),1600)}

async function doExport(){
  vid.pause();const M=$('modal'),mt=$('mText'),mb=$('mBar'),mo=$('mOut');M.classList.add('show');$('mTitle').textContent='يجهّز الفيديو…';mo.innerHTML='';mb.style.width='0%';$('exportBtn').disabled=true;$('mClose').disabled=true;
  try{
    onStyle();await fontsReady();RUNS=subRuns();
    await fetch(`${WK}/clear/${job}`,{method:'POST'});
    const QF=S.q.scale||1;const mk=()=>{const c=document.createElement('canvas');c.width=Math.round(W*QF/2)*2;c.height=Math.round(H*QF/2)*2;const x=c.getContext('2d');x.setTransform(c.width/W,0,0,c.height/H,0,0);return[c,x]};
    const up=async(n,c)=>{const b=await new Promise(r=>c.toBlob(r,'image/png'));const r=await fetch(`${WK}/layer/${job}?n=${n}`,{method:'POST',body:b});if(!r.ok)throw new Error('رفع')};
    let base;if(D.has_video&&S.bg.type==='video')base={type:'video',fit:S.bg.fit,glass:S.fx.glass&&S.bg.fit==='cover'?glassRect().map(v=>Math.round(v*QF/2)*2):null,box:box.map(v=>Math.round(v*QF/2)*2),gray:S.bg.gray,c1:S.bg.c1.slice(1),filt:S.filt};else{const[c,x]=mk();drawBase(x);await up('BG',c);base={type:'image'}}
    // change points
    const step=1/30,pts=[];let prev=null;for(let t=0;t<DUR;t+=step){const k=planKey(plan(t));if(k!==prev){pts.push(+t.toFixed(4));prev=k}}
    mt.textContent=`${pts.length} لقطة`;const frames=[];let done=0,i=0;
    const worker=async()=>{while(i<pts.length){const j=i++;const t=pts[j];const[c,x]=mk();drawOverlay(x,t);const n='F'+String(j).padStart(5,'0');await up(n,c);frames[j]={n,d:(pts[j+1]??DUR)-t};done++;mb.style.width=Math.round(done/pts.length*85)+'%';mt.textContent=`يرسم اللقطات… ${done} / ${pts.length}`}};
    await Promise.all([worker(),worker(),worker()]);
    mt.textContent='يركّب الفيديو…';
    const r=await fetch(`${WK}/export/${job}`,{method:'POST',body:JSON.stringify({mode:S.mode,W:Math.round(W*QF/2)*2,H:Math.round(H*QF/2)*2,trim:[0,DUR],base,frames,vol:S.audio.vol,afi:S.audio.fi,afo:S.audio.fo,crf:S.q.crf}),headers:{'Content-Type':'application/json'}});if(!r.ok)throw new Error('التصدير');
    const t0=Date.now();for(;;){await new Promise(z=>setTimeout(z,1500));const j=await (await fetch(`${WK}/status/${job}`,{cache:'no-store'})).json();
      if(j.render==='done'){mb.style.width='100%';$('mTitle').textContent='جاهز';mt.textContent='راجع الفيديو قبل لا ترسله: الآيات والتوقيت والتفسير.';const v=document.createElement('video');v.controls=true;v.src=`${WK}/file/${job}/${j.video}`;const a=document.createElement('a');a.className='dl';a.href=v.src;a.download=`rattil-${job}.mp4`;a.textContent='نزّل الفيديو';mo.append(v,a);break}
      if(j.render==='failed')throw new Error((j.tail||'').slice(-300));mt.textContent=`يركّب الفيديو… ${Math.floor((Date.now()-t0)/1000)} ث`;mb.style.width=Math.min(98,85+(Date.now()-t0)/1000)+'%'}
  }catch(e){$('mTitle').textContent='ما زبط التصدير';mt.textContent=e.message}
  $('exportBtn').disabled=false;$('mClose').disabled=false;onStyle()}

async function fontsReady(){const fams=['Noto Naskh Arabic','Amiri','Aref Ruqaa','Reem Kufi','Tajawal','Lateef','IBM Plex Sans Arabic','Cinzel','Cormorant Garamond','Inter'];const sample='سورة القارئ الآيات abc ABC 123 ١٢٣ '+(D.reciter||'');
  await Promise.all(fams.flatMap(f=>[document.fonts.load(`20px "${f}"`,sample),document.fonts.load(`600 20px "${f}"`,sample)]).map(p=>p.catch(()=>{})))}
async function buildDemo(){
  const sn=+QS.get('surah'),a0=+QS.get('from')||1,a1=Math.max(a0,+QS.get('to')||a0);
  const r=await (await fetch(`https://api.alquran.cloud/v1/surah/${sn}/editions/quran-uthmani,ar.muyassar,en.sahih?offset=${a0-1}&limit=${Math.min(40,a1-a0+1)}`)).json();
  const [Q,T,E]=r.data;const BS=['بِسْمِ','ٱللَّهِ','ٱلرَّحْمَٰنِ','ٱلرَّحِيمِ'];const groups={},tr={},words=[];
  Q.ayahs.forEach((a,i)=>{let ws=a.text.replace(/\uFEFF/g,'').split(' ').filter(Boolean);if(a.numberInSurah===1&&sn!==1&&sn!==9&&ws.slice(0,4).join(' ')===BS.join(' '))ws=ws.slice(4);
    const n=a.numberInSurah;ws[ws.length-1]+=' '+String.fromCharCode(0x6DD)+arn(n);groups[n]=T.ayahs[i].text;tr[n]=E.ayahs[i].text;
    for(let k=0;k<ws.length;k+=8)words.push({ayah:n,text:ws.slice(k,k+8).join(' ')})});
  const dur=vid.duration||30,t0=.5,t1=Math.max(t0+1,dur-.4),tot=words.reduce((x,w)=>x+w.text.split(' ').length,0);let t=t0;
  const sg=words.map(w=>{const d=(t1-t0)*w.text.split(' ').length/tot;const o={start:+t.toFixed(2),end:+(t+d).toFixed(2),text:w.text,ayah:w.ayah,g:w.ayah};t+=d;return o});
  const names=['الفاتحة','البقرة','آل عمران','النساء','المائدة','الأنعام','الأعراف','الأنفال','التوبة','يونس','هود','يوسف','الرعد','إبراهيم','الحجر','النحل','الإسراء','الكهف','مريم','طه','الأنبياء','الحج','المؤمنون','النور','الفرقان','الشعراء','النمل','القصص','العنكبوت','الروم','لقمان','السجدة','الأحزاب','سبأ','فاطر','يس','الصافات','ص','الزمر','غافر','فصلت','الشورى','الزخرف','الدخان','الجاثية','الأحقاف','محمد','الفتح','الحجرات','ق','الذاريات','الطور','النجم','القمر','الرحمن','الواقعة','الحديد','المجادلة','الحشر','الممتحنة','الصف','الجمعة','المنافقون','التغابن','الطلاق','التحريم','الملك','القلم','الحاقة','المعارج','نوح','الجن','المزمل','المدثر','القيامة','الإنسان','المرسلات','النبأ','النازعات','عبس','التكوير','الانفطار','المطففين','الانشقاق','البروج','الطارق','الأعلى','الغاشية','الفجر','البلد','الشمس','الليل','الضحى','الشرح','التين','العلق','القدر','البينة','الزلزلة','العاديات','القارعة','التكاثر','العصر','الهمزة','الفيل','قريش','الماعون','الكوثر','الكافرون','النصر','المسد','الإخلاص','الفلق','الناس'];
  return{surah:names[sn-1],surah_no:sn,ayah_from:a0,ayah_to:a1,reciter:QS.get('reader')||'',riwayah:'hafs',riwayah_label:'',tafsir_key:'muyassar',tafsir_label:'التفسير الميسر',groups,segs:sg,
    side:{muyassar:groups,tr},has_video:vid.videoWidth>0,w:vid.videoWidth,h:vid.videoHeight,duration:dur,trim:[0,dur]}}
async function demoPeaks(){try{const buf=await (await fetch(QS.get('src'))).arrayBuffer();const ac=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,44100,44100);const ab=await ac.decodeAudioData(buf);
  const ch=ab.getChannelData(0),step=Math.floor(ab.sampleRate/50),pk=[];for(let i=0;i<ch.length;i+=step){let m=0;for(let j=i;j<Math.min(i+step,ch.length);j+=4)m=Math.max(m,Math.abs(ch[j]));pk.push(m)}return{rate:ab.sampleRate/step,peaks:pk}}catch(e){return null}}
(async()=>{
  if(DEMO){try{document.body.classList.add('demo');
    const SAMPLE=QS.get('sample')==='1';
    const bar=document.createElement('div');bar.className='demobar';bar.textContent=SAMPLE?'مثال: جرّب القوالب والفلاتر على هالتلاوة وشوفها شغّالة. مقطعك يطلع بنفس الشكل على تلاوتك.':'معاينة: الآيات هني موزّعة على الوقت تقريبياً. في المقطع النهائي نركّب كل آية على صوت القارئ بالضبط.';document.querySelector('.app').prepend(bar);document.querySelector('.app').style.gridTemplateRows='auto 56px 1fr auto';
    vid.src=SAMPLE?'media/demo.mp4':QS.get('src');await new Promise((res,rej)=>{vid.onloadedmetadata=res;vid.onerror=()=>rej(new Error('ما قدرنا نفتح الملف'))});
    let PD=null;if(SAMPLE){PD=await (await fetch('media/demo.json')).json();D={...PD.D,segs:PD.segs}}else D=await buildDemo();SIDE=D.side;DUR=D.duration;$('dur').textContent=fmt(DUR,0);$('meta').textContent=`معاينة · سورة ${D.surah}`;document.title='رتّل | معاينة';
    const urls=SAMPLE?['media/hafs.ttf']:(await (await fetch('https://fonts.googleapis.com/css2?family=Amiri+Quran')).text()).match(/url\(([^)]+)\)/g).map(u=>u.slice(4,-1));
    await Promise.all([...urls.map(u=>new FontFace('Hafs',`url(${u})`).load().then(x=>document.fonts.add(x))),new FontFace('SurahNames','url(https://raw.githubusercontent.com/quran/quran.com-frontend-next/production/public/fonts/quran/surah-names/v1/sura_names.woff2)').load().then(x=>document.fonts.add(x))]);
    await fontsReady();
    S=tplStyle(TPL[QS.get('tpl')]?QS.get('tpl'):'hadi');const fl=QS.get('filt');if(fl&&FILTERS[fl]){S.filt={...DEF.filt,...FILTERS[fl].o,name:fl};S.bg.gray=!!FILTERS[fl].gray}
    const md=QS.get('mode');if(md&&(CANVAS[md]||md==='original'))S.mode=md;const sub=QS.get('sub');if(sub)S.sub.src=sub==='tr'||sub==='en'?'tr':sub==='none'?'none':'muyassar';if(S.sub.src!=='none'&&S.sub.src!=='tr')S.sub.src='muyassar';if(SAMPLE&&!sub)S.sub.src=tplStyle(TPL[QS.get('tpl')]?QS.get('tpl'):'hadi').sub.src.replace(/^(mukhtasar|saadi|en)$/,'muyassar');
    const hd=QS.get('handle');if(hd){S.outro.on=true;S.outro.text=hd}if(QS.get('reader'))S.reciter.text=QS.get('reader');
    if(!D.has_video&&S.bg.type==='video')S.bg.type='gradient';segs=clone(D.segs);PEAKS=SAMPLE?PD.peaks:await demoPeaks();
    ready=true;$('loading').remove();renderRail();renderPanel();renderSegbar();onStyle();fitTL();commit();
    vid.currentTime=segs[0]?segs[0].start+.3:0;vid.addEventListener('seeked',()=>{if(tab==='tpl')drawThumbs();if(tab==='filt')drawFThumbs()});requestAnimationFrame(frame);
  }catch(e){$('loading').textContent='ما قدرنا نسوي المعاينة: '+e.message}return}
  if(!job){$('loading').textContent='افتح المحرر من صفحة الطلبات.';return}
  try{
    D=await (await fetch(`${WK}/layout/${job}`,{cache:'no-store'})).json();if(D.error)throw new Error(D.error);
    SIDE=D.side||{};DUR=D.duration;$('dur').textContent=fmt(DUR,0);
    $('meta').textContent=`سورة ${D.surah||''} · ${D.riwayah_label||''}${D.reciter?' · '+D.reciter:''}`;document.title='رتّل | '+(D.surah||'المحرر');
    const ff=[new FontFace('Hafs',`url(${WK}/font/${job})`),new FontFace('SurahNames',`url(${WK}/asset/surah-font)`)];await Promise.all(ff.map(f=>f.load().then(x=>document.fonts.add(x))));
    await fontsReady();

    let proj={};try{proj=await (await fetch(`${WK}/project/${job}`,{cache:'no-store'})).json()}catch(e){}
    let saved=null;try{saved=JSON.parse(localStorage.getItem('rattil-s2')||'null')}catch(e){}
    S=proj.S?merge(clone(DEF),proj.S):saved?merge(clone(DEF),saved):tplStyle('hadi');if(!S.filt)S.filt=clone(DEF.filt);if(!S.q)S.q=clone(DEF.q);
    segs=proj.v===3&&proj.segs&&proj.segs.length?proj.segs:clone(D.segs); // older saves used an older way of reading the recitation
    if(!proj.S){const U=new URLSearchParams(location.search);const tp=U.get('tpl');if(tp&&TPL[tp])S=tplStyle(tp);  // first open of an order: start from what the customer picked
      const fl=U.get('filt');if(fl&&FILTERS[fl]){S.filt={...DEF.filt,...FILTERS[fl].o,name:fl};S.bg.gray=!!FILTERS[fl].gray}

      const sub=U.get('sub');if(sub&&SIDES.some(x=>x[0]===sub))S.sub.src=sub;const hd=U.get('handle');if(hd){S.outro.on=true;S.outro.text=hd}}
    if(S.sub.src!=='none'&&!SIDE[S.sub.src])loadSide(S.sub.src);

    vid.src=`${WK}/src/${job}`;await new Promise((res,rej)=>{vid.onloadedmetadata=res;vid.onerror=()=>rej(new Error('ما قدر يفتح التلاوة'))});
