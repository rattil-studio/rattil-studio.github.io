<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>رتّل | الطلبات</title>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@700;800&family=Readex+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--plum:#24102b;--plum-2:#331a3c;--line:#523160;--text:#fbf3ff;--soft:#cdb6d6;--glow:#ffd27a;--ink:#2a1700}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Readex Pro",system-ui,sans-serif;background:var(--plum);color:var(--text);line-height:1.7}
.wrap{max-width:1100px;margin:0 auto;padding:28px 18px 80px}
h1{font-family:"Alexandria";font-size:2rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.btn{font:600 .95rem "Readex Pro";color:var(--ink);background:var(--glow);border:0;border-radius:999px;padding:10px 18px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--soft);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:#ff9a9a;border:1.5px solid #6b3040}
.msg{color:var(--soft);margin-top:20px}
.card{background:var(--plum-2);border-radius:20px;padding:18px;margin-top:16px}
.card h2{font-family:"Alexandria";font-size:1.2rem;display:flex;justify-content:space-between;gap:10px}
.card h2 small{font-family:"Readex Pro";font-weight:400;font-size:.8rem;color:var(--soft)}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-top:10px;font-size:.92rem}
dt{color:var(--soft)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.dz{font-size:.85rem;color:var(--soft);margin-top:10px}.dz b{color:var(--glow)}
.design{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.design select{font:400 .9rem "Readex Pro";color:var(--text);background:var(--plum);border:1.5px solid var(--line);border-radius:10px;padding:8px}
.prog{font-size:.85rem;color:var(--soft);white-space:pre-wrap;max-height:90px;overflow:hidden;direction:ltr;text-align:left;margin-top:8px}
.qa{width:100%;border-radius:12px;margin-top:10px}
.studio{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:20px;margin-top:12px}
.pv img{width:100%;border-radius:14px;background:#000;transition:opacity .3s;min-height:200px}
.ctl .sg{margin-bottom:14px}.sgt{font-size:.85rem;color:var(--soft);margin-bottom:6px}.sgt small{opacity:.7}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:400 .85rem "Readex Pro";color:var(--text);background:var(--plum);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--glow);color:var(--ink);border-color:var(--glow);font-weight:600}
.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.swsep{grid-column:1/-1;height:1px;background:var(--line);margin:2px 0}
.sw{background:none;border:0;color:var(--soft);font:400 .68rem "Readex Pro";cursor:pointer;padding:0;text-align:center}
.sw i{display:grid;place-items:center;height:46px;border-radius:12px;font-style:normal;font-family:"Amiri Quran",serif;font-size:1.1rem;border:2px solid transparent}
.sw[aria-pressed="true"] i{border-color:var(--glow)}.sw[aria-pressed="true"]{color:var(--text)}
.pk{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:.8rem;color:var(--soft)}
.pk input{width:30px;height:24px;border:0;background:none;vertical-align:middle;cursor:pointer}
.ti{width:100%;font:400 .9rem "Readex Pro";color:var(--text);background:var(--plum);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
@media (max-width:700px){.studio{grid-template-columns:1fr}}
audio,video{width:100%;margin-top:12px;border-radius:12px;max-height:360px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>طلبات رتّل</h1><p style="margin:6px 0 14px"><a class="btn" href="http://127.0.0.1:8765/new" target="_blank" rel="noopener">+ تلاوة من الواتساب أو ملف</a></p><button class="btn" id="login">دخول بجوجل</button></div>
  <p class="dz" id="dz">المصمم: يفحص…</p>
  <p class="msg" id="msg">سجّل دخولك بحساب جوجل حقك عشان تشوف الطلبات.</p>
  <div id="list"></div>
</div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,collection,query,orderBy,getDocs,deleteDoc,doc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const app=initializeApp({apiKey:"AIzaSyCItsJ7A-egrSZc40lK_3z1H_Vj_l8xfJ8",authDomain:"ad3eya.firebaseapp.com",projectId:"ad3eya",storageBucket:"ad3eya.firebasestorage.app",messagingSenderId:"1021494775776",appId:"1:1021494775776:web:938c4b98379299073de585"});
const auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const ar=n=>Number(n).toLocaleString('ar-EG');
let signedIn=false;
const WK='http://127.0.0.1:8765';
const N="الفاتحة البقرة آل_عمران النساء المائدة الأنعام الأعراف الأنفال التوبة يونس هود يوسف الرعد إبراهيم الحجر النحل الإسراء الكهف مريم طه الأنبياء الحج المؤمنون النور الفرقان الشعراء النمل القصص العنكبوت الروم لقمان السجدة الأحزاب سبأ فاطر يس الصافات ص الزمر غافر فصلت الشورى الزخرف الدخان الجاثية الأحقاف محمد الفتح الحجرات ق الذاريات الطور النجم القمر الرحمن الواقعة الحديد المجادلة الحشر الممتحنة الصف الجمعة المنافقون التغابن الطلاق التحريم الملك القلم الحاقة المعارج نوح الجن المزمل المدثر القيامة الإنسان المرسلات النبأ النازعات عبس التكوير الانفطار المطففين الانشقاق البروج الطارق الأعلى الغاشية الفجر البلد الشمس الليل الضحى الشرح التين العلق القدر البينة الزلزلة العاديات القارعة التكاثر العصر الهمزة الفيل قريش الماعون الكوثر الكافرون النصر المسد الإخلاص الفلق الناس".split(" ").map(s=>s.replace("_"," "));
const THK={"كحلي وذهبي":"navy_gold","أزرق ملكي":"royal_blue","زمردي وذهبي":"emerald","رمضاني":"ramadan","فيروزي":"turquoise","عنابي وذهبي":"burgundy","فضي ليلي":"silver_night","أبيض هادئ":"white_soft","وردي ناعم":"rose","رملي":"sand","أبيض وأسود":"mono","مصحف ورقي (بدون توهج)":"mushaf"};
const TAFK={"التفسير الميسر":"muyassar","التفسير المختصر":"mukhtasar","تفسير السعدي":"saadi","تفسير إنجليزي":"en","ترجمة إنجليزية":"muyassar","بدون":"none"};
const SUBK={"التفسير الميسر":"muyassar","التفسير المختصر":"mukhtasar","تفسير السعدي":"saadi","تفسير إنجليزي":"en","ترجمة إنجليزية":"tr","بدون":"none"};
const QK={"Full HD":1,"2K":1.3334,"4K":2};
const modeOf=s=>s.startsWith('ريلز')?'reel':s.startsWith('مربع')?'square':s.startsWith('يوتيوب')?'youtube':s.startsWith('مثل')?'original':'reel';
const RIW=[['hafs','حفص'],['shouba','شعبة'],['warsh','ورش'],['qaloon','قالون'],['doori','الدوري'],['soosi','السوسي'],['bazzi','البزي'],['qumbul','قنبل']];
let wkOn=false;
async function ping(){try{const r=await fetch(WK+'/ping',{cache:'no-store'});wkOn=r.ok}catch(e){wkOn=false}
  $('dz').innerHTML=wkOn?'المصمم: <b>شغّال</b> على اللابتوب':'المصمم: مو شغّال. شغّل <b>start.bat</b> في مجلد rattil-worker عشان تقدر تصمم.'}
ping();setInterval(ping,15000);
const RTH=[['r_plum','رتّل بنفسجي','#FFF6E6','#FFD27A','#1C0A22','#4A2457'],['r_dawn','فجر','#FFFFFF','#FF9E7A','#1E0C16','#7A3B45'],['r_gulf','خليج','#F2FBFF','#5FD3E6','#03161E','#0E4D5E'],['r_olive','زيتوني','#FBFFF2','#C9D86B','#10150A','#3A4420'],['r_ink','حبر','#FFFFFF','#9FB4FF','#05060D','#1B2142'],['r_amber','كهرماني','#FFF9EE','#FFB000','#140B02','#4A2C08'],
 ['navy_gold','كحلي وذهبي','#FFF8E6','#F0B446','#050A24','#14234F'],['royal_blue','أزرق ملكي','#FFFFFF','#4D8CFF','#030A2A','#0C2A7A'],['emerald','زمردي وذهبي','#F3FFF7','#3FD18A','#02140E','#0B3B2A'],['ramadan','رمضاني','#FFF4DC','#FFB347','#12062B','#3A1A5E'],['turquoise','فيروزي','#F0FFFF','#2EC4C6','#021A22','#0B4650'],['burgundy','عنابي وذهبي','#FFF3E8','#E9A23B','#22050C','#5A1023'],['silver_night','فضي ليلي','#F4F7FF','#9DB4FF','#05070F','#1A2240'],['white_soft','أبيض هادئ','#FFFFFF','#FFFFFF','#0B0B0E','#26262E'],['rose','وردي ناعم','#FFF5F8','#FF8FB1','#1E0710','#4A1630'],['sand','رملي','#FFF8EC','#E8B07A','#1F140A','#4E3520'],['mono','أبيض وأسود','#FFFFFF','#FFFFFF','#000000','#1A1A1A'],['mushaf','مصحف ورقي','#2B1D0E','#000000','#F3EAD3','#E2D1A6']];
const DEF_STYLE={theme:'r_plum',colors:{},glow:1,size:1,tafsir_font:'naskh',pos:'bottom',words:true,title:'ruqaa',frame:true,intro:true,outro:'',bg:'pattern'};
const loadStyle=()=>{try{return Object.assign({},DEF_STYLE,JSON.parse(localStorage.getItem('rattil-style')||'{}'))}catch(e){return {...DEF_STYLE}}};
const saveStyle=s=>{try{localStorage.setItem('rattil-style',JSON.stringify(s))}catch(e){}};
function designUI(o,id,c,getBlob){
  const box=document.createElement('div');box.className='design';
  const head=document.createElement('div');head.className='acts';
  const riw=document.createElement('select');riw.innerHTML=RIW.map(([k,n])=>`<option value="${k}">رواية ${n}</option>`).join('');
  const open=document.createElement('button');open.className='btn';open.textContent='افتح الاستوديو';
  if(o.riw)riw.value=o.riw;head.append(riw,open);
  const prog=document.createElement('div');prog.className='prog';
  box.append(head,prog);
  let job=null,S=loadStyle(),mode=modeOf(o.size||''),t=1,seq=0,timer=null;
  if(THK[o.theme]&&!localStorage.getItem('rattil-style'))S.theme=THK[o.theme];
  open.onclick=async()=>{
    if(!wkOn){await ping();if(!wkOn){prog.textContent='المصمم مو شغّال. شغّل start.bat وجرّب مرة ثانية.';return}}
    open.disabled=true;open.textContent='يجهّز التلاوة…';
    try{
      const blob=await getBlob();const sn=N.indexOf(o.surah)+1;
      const q=new URLSearchParams({code:o.code,tafsir:TAFK[o.taf]||'muyassar',riwayah:riw.value,reciter:o.reader||''});
      if(sn>0&&o.from&&o.to)q.set('range',`${sn}:${o.from}-${o.to}`);
      const r=await fetch(`${WK}/prepare?${q}`,{method:'POST',body:blob,headers:{'X-Filename':(o.fileName||'tilawa.m4a').replace(/[^\w.\-]/g,'_')}});
      const {id:jid,error}=await r.json();if(error)throw new Error(error);job=jid;
      const t0=Date.now();
      const tick=async()=>{const st=await (await fetch(`${WK}/status/${jid}`,{cache:'no-store'})).json();
        if(st.state==='ready'){const u=WK+'/studio?'+new URLSearchParams({job:jid,tpl:o.tpl||'',filt:o.filt||'',mode:modeOf(o.size||''),q:QK[o.qual]||1,sub:SUBK[o.taf]||'muyassar',handle:o.handle||''});prog.innerHTML='';const a=document.createElement('a');a.href=u;a.target='_blank';a.className='btn';a.textContent='افتح المحرر';prog.appendChild(a);open.disabled=false;open.textContent='جهّز من جديد';window.open(u,'_blank');return}
        if(st.state==='failed'){prog.textContent='ما قدر يتعرّف على التلاوة:\n'+(st.tail||'').slice(-300);open.disabled=false;open.textContent='جرّب مرة ثانية';return}
        prog.textContent=`يسمع التلاوة ويرتّب الآيات… (${Math.floor((Date.now()-t0)/60000)} د)`;setTimeout(tick,4000)};tick();
    }catch(e){prog.textContent='صار خطأ: '+e.message;open.disabled=false;open.textContent='افتح الاستوديو'}
  };
  function grp(title,items,get,set){
    const g=document.createElement('div');g.className='sg';const h=document.createElement('div');h.className='sgt';h.textContent=title;g.appendChild(h);
    const row=document.createElement('div');row.className='opts';
    items.forEach(([v,label])=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=label;b.setAttribute('aria-pressed',get()===v);
      b.onclick=()=>{set(v);row.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));changed()};row.appendChild(b)});
    g.appendChild(row);return g;
  }
  function changed(){saveStyle(S);clearTimeout(timer);timer=setTimeout(preview,700)}
  let img,stat,vidBox,expBtn;
  async function preview(){
    const my=++seq;stat.textContent='يحدّث المعاينة…';img.style.opacity=.55;
    try{const r=await fetch(`${WK}/preview/${job}?mode=${mode}&t=${t.toFixed(2)}`,{method:'POST',body:JSON.stringify(S),headers:{'Content-Type':'application/json'}});
      const d=await r.json();if(my!==seq)return;if(d.error)throw new Error(d.error);
      img.src=`${WK}/file/${job}/${d.image}`;img.onload=()=>{img.style.opacity=1};stat.textContent='';
    }catch(e){if(my===seq){stat.textContent='ما زبطت المعاينة: '+e.message.slice(-200);img.style.opacity=1}}
  }
  function buildStudio(st){
    const wrap=document.createElement('div');wrap.className='studio';
    const left=document.createElement('div');left.className='pv';
    img=document.createElement('img');img.alt='معاينة';stat=document.createElement('div');stat.className='prog';
    const tl=document.createElement('div');tl.className='opts';tl.style.marginTop='10px';
    st.phrases.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent='مقطع '+ar(i+1);b.setAttribute('aria-pressed',i===0);
      b.onclick=()=>{t=(p.start+p.end)/2;tl.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));preview()};tl.appendChild(b)});
    t=st.phrases.length?(st.phrases[0].start+st.phrases[0].end)/2:1;
    left.append(img,stat,tl);
    const right=document.createElement('div');right.className='ctl';
    const sw=document.createElement('div');sw.className='sg';sw.innerHTML='<div class="sgt">الألوان <small>(أول ٦ خاصة برتّل)</small></div>';
    const swr=document.createElement('div');swr.className='sws';
    RTH.forEach(([k,n,ay,gl,b0,b1],i)=>{const b=document.createElement('button');b.type='button';b.className='sw';b.title=n;b.setAttribute('aria-pressed',S.theme===k);
      b.innerHTML=`<i style="background:radial-gradient(circle at 50% 30%,${b1},${b0});color:${ay};text-shadow:0 0 8px ${gl}">آية</i><span></span>`;b.querySelector('span').textContent=n;
      if(i===6){const sep=document.createElement('div');sep.className='swsep';swr.appendChild(sep)}
      b.onclick=()=>{S.theme=k;S.colors={};swr.querySelectorAll('.sw').forEach(x=>x.setAttribute('aria-pressed',x===b));pk.querySelectorAll('input').forEach(x=>x.value=x.dataset.d);changed()};swr.appendChild(b)});
    sw.appendChild(swr);
    const pk=document.createElement('div');pk.className='pk';
    [['ayah','لون الآية'],['glow','لون التوهج'],['tafsir','لون التفسير'],['accent','لون الإطار']].forEach(([k,l])=>{
      const lab=document.createElement('label');const inp=document.createElement('input');inp.type='color';inp.dataset.d='#ffffff';inp.value=(S.colors||{})[k]||'#ffffff';
      inp.oninput=()=>{S.colors={...(S.colors||{}),[k]:inp.value};changed()};lab.append(inp,document.createTextNode(' '+l));pk.appendChild(lab)});
    sw.appendChild(pk);
    right.append(
      grp('المقاس',[['reel','ريلز'],['square','مربع'],['youtube','يوتيوب']],()=>mode,v=>mode=v),
      sw,
      grp('التوهج',[[0.5,'خفيف'],[1,'متوسط'],[1.5,'قوي']],()=>S.glow,v=>S.glow=v),
      grp('حجم الآية',[[0.85,'صغير'],[1,'وسط'],[1.2,'كبير']],()=>S.size,v=>S.size=v),
      grp('خط التفسير',[['naskh','نسخ'],['tajawal','تجوّل'],['amiri','أميري'],['plex','الافتراضي']],()=>S.tafsir_font,v=>S.tafsir_font=v),
      grp('مكان الكتابة',[['bottom','تحت'],['middle','بالنص']],()=>S.pos,v=>S.pos=v),
      grp('الكلمات تضيء وحدة وحدة',[[true,'تشغيل'],[false,'إيقاف']],()=>S.words,v=>S.words=v),
      grp('اسم السورة والقارئ',[['ruqaa','رقعة'],['kufi','كوفي'],['amiri','أميري'],['off','بدون']],()=>S.title,v=>S.title=v),
      grp('الإطار',[[true,'تشغيل'],[false,'إيقاف']],()=>S.frame,v=>S.frame=v),
      grp('الدخلة (اسم السورة بالبداية)',[[true,'تشغيل'],[false,'إيقاف']],()=>S.intro,v=>S.intro=v),
      grp('الخلفية (للتلاوة الصوتية)',[['pattern','زخرفة'],['stars','نجوم'],['bokeh','أضواء'],['gradient','تدرج'],['arch','قوس']],()=>S.bg,v=>S.bg=v)
    );
    const og=document.createElement('div');og.className='sg';og.innerHTML='<div class="sgt">الختام (نص بآخر المقطع، مثل اسم حسابك)</div>';
    const oi=document.createElement('input');oi.className='ti';oi.placeholder='اتركه فاضي إذا ما تبي ختام';oi.value=S.outro||'';oi.oninput=()=>{S.outro=oi.value;saveStyle(S)};og.appendChild(oi);right.appendChild(og);
    const note=document.createElement('p');note.className='dz';note.textContent='الدخلة والختام والكلمات اللي تضيء تشوفها في الفيديو النهائي، مو في صورة المعاينة.';right.appendChild(note);
    expBtn=document.createElement('button');expBtn.className='btn';expBtn.style.width='100%';expBtn.style.marginTop='14px';expBtn.textContent='صدّر الفيديو';
    vidBox=document.createElement('div');
    expBtn.onclick=async()=>{expBtn.disabled=true;expBtn.textContent='يصدّر…';vidBox.innerHTML='';
      const r=await fetch(`${WK}/render/${job}?mode=${mode}`,{method:'POST',body:JSON.stringify(S),headers:{'Content-Type':'application/json'}});
      const d=await r.json();if(d.error){expBtn.textContent='صدّر الفيديو';expBtn.disabled=false;vidBox.textContent=d.error;return}
      const t0=Date.now();
      const tick=async()=>{const s2=await (await fetch(`${WK}/status/${job}`,{cache:'no-store'})).json();
        if(s2.render==='done'){expBtn.disabled=false;expBtn.textContent='صدّر مرة ثانية';
          const v=document.createElement('video');v.controls=true;v.src=`${WK}/file/${job}/${s2.video}`;
          const a=document.createElement('a');a.className='btn';a.textContent='نزّل الفيديو';a.href=v.src;a.download=`rattil-${o.code}.mp4`;
          const p=document.createElement('p');p.className='dz';p.textContent='راجعه قبل لا ترسله: الآيات والتوقيت والتفسير.';
          vidBox.append(v,p,a);return}
        if(s2.render==='failed'){expBtn.disabled=false;expBtn.textContent='جرّب مرة ثانية';vidBox.textContent='ما زبط التصدير: '+(s2.tail||'').slice(-300);return}
        expBtn.textContent=`يصدّر… (${Math.floor((Date.now()-t0)/1000)} ث)`;setTimeout(tick,3000)};tick();
    };
    right.append(expBtn,vidBox);
    wrap.append(left,right);box.appendChild(wrap);preview();
  }
  return box;
}

$('login').onclick=async()=>{if(signedIn){await signOut(auth);return}try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$('msg').textContent='ما تم الدخول: '+e.code}};
onAuthStateChanged(auth,u=>{signedIn=!!u;$('login').textContent=u?'خروج':'دخول بجوجل';$('login').className=u?'btn ghost':'btn';if(u)load();else{$('list').innerHTML='';$('msg').textContent='سجّل دخولك بحساب جوجل حقك عشان تشوف الطلبات.'}});
async function chunksOf(id){const s=await getDocs(query(collection(db,'orders',id,'chunks'),orderBy('i')));return s.docs}
async function load(){
  $('msg').textContent='يحمّل الطلبات…';$('list').innerHTML='';
  let snap;try{snap=await getDocs(query(collection(db,'orders'),orderBy('createdAt','desc')))}catch(e){$('msg').textContent='هالحساب ما عنده صلاحية يشوف الطلبات.';return}
  $('msg').textContent=snap.size?`${ar(snap.size)} طلب`:'ما فيه طلبات للحين.';
  snap.forEach(d=>{
    const o=d.data(),c=document.createElement('div');c.className='card';
    const when=o.createdAt?.toDate?.().toLocaleString('ar-KW',{dateStyle:'medium',timeStyle:'short'})||'';
    const rows=[['الاسم',o.cname||'—'],['السورة',o.surah?`${o.surah} (${ar(o.from)}–${ar(o.to)})`:'—'],['التصميم',o.theme],['الفلتر',o.filt||'—'],['الرواية',(RIW.find(x=>x[0]===o.riw)||['','حفص'])[1]],['المقاس',o.size],['الجودة',o.qual||'Full HD'],['الطول',o.len],['تحت الآيات',o.taf],['الحساب',o.handle||'—'],['القارئ',o.reader||'—'],['ملاحظات',o.notes||'—'],['السعر',`${ar(o.price)} د.ك`],['الملف',o.chunks?`${o.fileName} · ${ar((o.bytes/1048576).toFixed(1))} ميجا`:'ما انرفع ملف']];
    c.innerHTML=`<h2><span></span><small></small></h2><dl></dl><div class="acts"></div>`;
    c.querySelector('h2 span').textContent='طلب '+o.code;c.querySelector('h2 small').textContent=when;
    const dl=c.querySelector('dl');rows.forEach(([a,b])=>{const t=document.createElement('dt');t.textContent=a;const v=document.createElement('dd');v.textContent=b;dl.append(t,v)});
    const acts=c.querySelector('.acts');
    let blobP=null;
    const getBlob=()=>blobP||(blobP=chunksOf(d.id).then(xs=>new Blob(xs.map(x=>x.data().data.toUint8Array()),{type:o.mime||'application/octet-stream'})));
    if(o.chunks){
      const get=document.createElement('button');get.className='btn';get.textContent='افتح التلاوة';
      get.onclick=async()=>{get.disabled=true;get.textContent='يحمّل…';
        const blob=await getBlob(),url=URL.createObjectURL(blob);
        const m=document.createElement((o.mime||'').startsWith('video')?'video':'audio');m.controls=true;m.src=url;c.appendChild(m);
        const a=document.createElement('a');a.className='btn ghost';a.href=url;a.download=o.fileName||('tilawa-'+o.code);a.textContent='نزّل الملف';get.replaceWith(a);};
      acts.appendChild(get);
    }
    const del=document.createElement('button');del.className='btn danger';del.textContent='احذف الطلب';
    del.onclick=async()=>{if(del.dataset.sure!=='1'){del.dataset.sure='1';del.textContent='متأكد؟ اضغط مرة ثانية';return}
      del.disabled=true;for(const x of await chunksOf(d.id))await deleteDoc(x.ref);await deleteDoc(d.ref);c.remove();};
    acts.appendChild(del);
    if(o.chunks)c.appendChild(designUI(o,d.id,c,getBlob));
    $('list').appendChild(c);
  });
}
</script>
</body>
</html>
