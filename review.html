<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>رتّل | قيّم مقطعك</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--plum:#1d0f22;--plum-2:#2a1630;--line:#4a2d52;--text:#f6eefa;--soft:#cdb6d6;--glow:#f0b446}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(120% 70% at 50% 0%,#3b1d45,var(--plum));color:var(--text);font:400 16px/1.7 "Readex Pro",system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
.box{width:min(460px,100%);background:var(--plum-2);border:1.5px solid var(--line);border-radius:24px;padding:28px}
.logo{font-weight:600;font-size:1.4rem}.logo span{color:var(--glow)}
h1{font-size:1.25rem;margin:14px 0 4px}p.sub{color:var(--soft);font-size:.95rem}
.stars{display:flex;gap:6px;margin:20px 0 6px;direction:ltr;justify-content:center}
.stars button{background:none;border:0;font-size:2.4rem;color:#5c4363;cursor:pointer;min-width:48px;min-height:48px;transition:transform .15s,color .15s}
.stars button.on{color:var(--glow)}.stars button:hover{transform:scale(1.1)}
label{display:block;color:var(--soft);font-size:.9rem;margin:16px 0 6px}
input,textarea{width:100%;font:inherit;color:var(--text);background:var(--plum);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--glow)}
button.send{width:100%;margin-top:20px;min-height:52px;border:0;border-radius:14px;background:var(--glow);color:#1d0f22;font:600 1.05rem "Readex Pro";cursor:pointer}
button.send:disabled{opacity:.6}
.msg{margin-top:14px;min-height:24px;color:var(--soft)}.msg.err{color:#ffb4b4}
.done{text-align:center}.done .big{font-size:3rem;color:var(--glow)}
</style>
</head>
<body>
<main class="box" id="box">
  <div class="logo">رتّ<span>ل</span></div>
  <h1>وش رأيك في مقطعك؟</h1>
  <p class="sub">رأيك يساعدنا نتحسّن، ويساعد غيرك يختار.</p>
  <div class="stars" id="stars" role="radiogroup" aria-label="التقييم من ٥"></div>
  <label for="text">اكتب رأيك</label>
  <textarea id="text" maxlength="400" placeholder="شنو عجبك؟ وشنو نقدر نحسّنه؟"></textarea>
  <label for="name">اسمك (يطلع مع رأيك)</label>
  <input id="name" maxlength="40" placeholder="مثلاً: أبو محمد">
  <button class="send" id="send">أرسل التقييم</button>
  <p class="msg" id="msg" role="status"></p>
</main>
<script type="module">
const $=id=>document.getElementById(id);
const code=(new URLSearchParams(location.search).get('c')||'').replace(/[^A-Z0-9]/g,'').slice(0,8);
let stars=5;
const sb=$('stars');for(let i=1;i<=5;i++){const b=document.createElement('button');b.type='button';b.textContent='★';b.setAttribute('role','radio');b.setAttribute('aria-label',i+' من ٥');b.onclick=()=>{stars=i;paint()};sb.appendChild(b)}
const paint=()=>[...sb.children].forEach((b,i)=>{b.classList.toggle('on',i<stars);b.setAttribute('aria-checked',i+1===stars)});paint();
if(!code){$('msg').textContent='الرابط ناقص. اطلب من رتّل رابط التقييم.';$('msg').className='msg err';$('send').disabled=true}
$('send').onclick=async()=>{const text=$('text').value.trim();if(text.length<3){$('msg').textContent='اكتب رأيك بكلمتين على الأقل.';$('msg').className='msg err';return}
  $('send').disabled=true;$('msg').className='msg';$('msg').textContent='يرسل…';
  try{const {initializeApp}=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');const fs=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    const db=fs.getFirestore(initializeApp({apiKey:"AIzaSyCItsJ7A-egrSZc40lK_3z1H_Vj_l8xfJ8",authDomain:"ad3eya.firebaseapp.com",projectId:"ad3eya"}));
    await fs.setDoc(fs.doc(db,'reviews',code),{code,stars,text:text.slice(0,400),name:$('name').value.trim().slice(0,40),approved:false,createdAt:fs.serverTimestamp()});
    $('box').innerHTML='<div class="done"><div class="big">★</div><h1>شكراً لك</h1><p class="sub">وصلنا رأيك. جزاك الله خير.</p></div>'}
  catch(e){$('msg').className='msg err';$('msg').textContent='ما قدرنا نرسله. يمكن الرابط قديم أو قيّمت قبل.';$('send').disabled=false}};
</script>
</body>
</html>
